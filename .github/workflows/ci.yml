name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy src infra

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not integration"

  golden-pgvector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Start and seed pgvector
        run: docker compose up -d --wait pgvector
      - name: Golden fixture and introspection tests
        run: uv run pytest -m integration tests/integration/test_golden_fixtures.py::test_documents_table tests/integration/test_golden_fixtures.py::test_products_table tests/integration/test_golden_fixtures.py::test_tenants_rls_policy tests/integration/test_golden_introspection.py tests/integration/test_pgvector_source_docker.py tests/integration/test_pgvector_cdc_docker.py
      - if: always()
        run: docker compose down -v

  golden-opensearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Start and seed OpenSearch
        run: |
          docker compose up -d --wait opensearch
          docker compose run --rm opensearch-seed
      - name: OpenSearch source tests against the golden index
        run: uv run pytest -m integration tests/integration/test_opensearch_source_docker.py
      - if: always()
        run: docker compose down -v

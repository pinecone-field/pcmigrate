migration_id: golden-os
source:
  kind: opensearch
  snapshot: exported
target:
  index: golden-os
  mode: create
  type: vector
  cloud: aws
  region: us-east-1
  capacity: on_demand
  dense_field: dense
  sparse_field: sparse
  api_version: 2026-07
objects:
- source: golden-documents
  namespace: golden-documents
  id_template: golden-documents#{_id}
  dense:
    column: embedding
    dimension: 768
    metric: cosine
  metadata:
  - source: author
    target: author
    type: string
    transform: stringify
  - source: body
    target: body
    type: string
  - source: category
    target: category
    type: string
  - source: doc_id
    target: doc_id
    type: string
  - source: published_at
    target: published_at
    type: epoch_seconds
  - source: summary
    target: summary
    type: string
  - source: title
    target: title
    type: string
  - source: views
    target: views
    type: integer
  - source: sparse
    action: drop
    reason: additional rank_features column; the dense wave carries one vector per record
duplicates: upsert_after_import
change_capture:
  tier: dual_write
  buffer: sqs_fifo
  rescan: false
validation:
  recall_at_k:
    k: 10
    queries: 200
    threshold: 0.95
  fidelity_sample: 1000

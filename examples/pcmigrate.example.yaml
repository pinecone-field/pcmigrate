# pcmigrate run settings. Copy next to your migration artifacts and edit.
# Secret VALUES never go here: the Pinecone key is read from Secrets Manager by ARN, or from
# the environment variable named in pinecone_api_key_env for laptop runs.
migration:
  migration_id: golden-live-01          # slug; also the S3 prefix and the Pulumi stack suffix
  bucket: pcmigrate                      # staging bucket (ADR-003)
  bucket_mode: create                    # create (the stack owns it) | adopt (an existing bucket, e.g. one with a registered storage integration)
  aws_region: us-east-1
  pinecone_api_key_secret: arn:aws:secretsmanager:us-east-1:000000000000:secret:placeholder
  storage_integration_id: 00000000-0000-0000-0000-000000000000   # Pinecone S3 integration id
  workers: 4
  partition_rows: 1000                   # 2_000_000 in production; small here to see partitions
  canonical_part_bytes: 67108864         # 64 MiB; 256 MiB in production
  lock_ttl_seconds: 60
  # name_prefix: acme-prod               # optional: every AWS resource becomes <prefix>-pcmigrate-<id>-...
  # tags:                                # optional: put on every AWS resource the stacks create
  #   CostCenter: "4711"
  #   Owner: data-platform
  #   Environment: prod
mapping_path: pcmigrate-out/mapping.yaml # written by introspect
artifacts_dir: pcmigrate-out
dsn_env: PGVECTOR_DSN                    # environment variable holding the source DSN
pinecone_api_key_env: PINECONE_API_KEY   # laptop only; omit on the runner to use the secret

# OpenSearch sources only (mapping.source.kind: opensearch). Omit the block for pgvector.
opensearch:
  url_env: OPENSEARCH_URL              # https://search-<domain>.<region>.es.amazonaws.com
  auth: sigv4                          # sigv4 (Amazon OpenSearch Service) | basic | none
  # basic_auth_env: OPENSEARCH_BASIC_AUTH   # user:password, self-managed laptop runs only
  export_mode: osis_glue               # osis_glue (ADR-009) | direct (runner scan; laptop and tests)
  domain_arn: arn:aws:es:us-east-1:000000000000:domain/golden     # managed domains
  domain_name: golden
  fine_grained_access: false           # true maps the pipeline role into all_access
  manage_domain_policy: false          # true replaces the domain access policy with the stack's
  # credentials_secret_arn: arn:aws:secretsmanager:...   # self-managed: {username, password}
  # subnet_ids: [subnet-...]           # self-managed in the VPC: OSIS VPC endpoint
  # security_group_ids: [sg-...]
  osis_min_units: 1
  osis_max_units: 4
  scan_timeout_s: 21600
  glue_workers: 4
  glue_worker_type: G.1X
  # wheel_path: ./dist/pcmigrate-0.0.1-py3-none-any.whl   # when not running from a checkout
